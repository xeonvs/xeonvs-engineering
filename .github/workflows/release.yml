name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_catalog.py
      - run: python scripts/sync_upstreams.py --verify-recorded
      - run: |
          mkdir dist
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude=.git --exclude=dist \
            --exclude='__pycache__' --exclude='*/__pycache__' \
            --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='.pytest_cache' --exclude='*/.pytest_cache' \
            -czf dist/xeonvs-engineering-${GITHUB_REF_NAME}.tar.gz .
          if tar -tzf dist/xeonvs-engineering-${GITHUB_REF_NAME}.tar.gz | \
              grep -E '(^|/)(__pycache__/|.*\.(pyc|pyo)$|\.pytest_cache/)'; then
            echo 'Generated Python cache files must not be published.' >&2
            exit 1
          fi
          sha256sum dist/xeonvs-engineering-${GITHUB_REF_NAME}.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
