name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xeonvs/codex-engineering-workflow
          ref: d83fd005fda4dd6efdfe167c478b0dd500a77eda
          path: .sources/engineering-workflow
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xeonvs/tgrep-search
          ref: e316614144d14efb7bdf63f49ff820a12bdedc84
          path: .sources/tgrep-search
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: >-
          python scripts/validate_catalog.py
          --source engineering-workflow=.sources/engineering-workflow
          --source tgrep-search=.sources/tgrep-search
